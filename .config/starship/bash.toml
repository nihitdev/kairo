palette = "prism"
add_newline = true

format = """
$directory$git_branch$git_status
$character"""

[directory]
style = "bold accent"
truncation_length = 4

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold red"
format = " [$all_status$ahead_behind]($style)"

[character]
success_symbol = "[::>](bold green)"
error_symbol = "[::>](bold red)"
vimcmd_symbol = "[::>](bold yellow)"

[palettes.prism]
base = "#191724"
surface = "#26233a"
text = "#e0def4"
blue = "#31748f"
cyan = "#9ccfd8"
mauve = "#c4a7e7"
green = "#9ccfd8"
red = "#eb6f92"
yellow = "#f6c177"
peach = "#ebbcba"
overlay = "#908caa"
arch = "#ebbcba"
accent = "#ebbcba"
purple = "#c4a7e7"
bright-black = "#908caa"
