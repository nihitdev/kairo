add_newline = true

# Last command duration at the right edge of the input line.
right_format = "$cmd_duration"

format = """
[╭─    ](bold cyan)$directory$git_branch$git_status
[╰─](bold cyan)$character"""

[directory]
style = "bold cyan"
format = "[$path]($style)"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold red"
format = " [$all_status$ahead_behind]($style)"

[character]
success_symbol = "[ζ](bold green) "
error_symbol = "[ζ](bold red) "
vimcmd_symbol = "[ζ](bold yellow) "

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[󰔛 $duration]($style)"
style = "bold purple"
