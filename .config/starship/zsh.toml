palette = "prism"
add_newline = true

# Last command duration at the right edge of the input line.
right_format = "$cmd_duration"

format = """
[╭─    ](bold accent)$directory$git_branch$git_status
[╰─](bold accent)$character"""

[directory]
style = "bold accent"
format = "[$path]($style)"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = " "
style = "bold purple"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold red"
format = " [$all_status$ahead_behind]($style)"

[character]
success_symbol = "[ζ](bold green) "
error_symbol = "[ζ](bold red) "
vimcmd_symbol = "[ζ](bold yellow) "

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[󰔛 $duration]($style)"
style = "bold purple"

[palettes.prism]
base = "#191724"
surface = "#26233a"
text = "#e0def4"
blue = "#31748f"
cyan = "#9ccfd8"
mauve = "#c4a7e7"
green = "#9ccfd8"
red = "#eb6f92"
yellow = "#f6c177"
peach = "#ebbcba"
overlay = "#908caa"
arch = "#ebbcba"
accent = "#ebbcba"
purple = "#c4a7e7"
bright-black = "#908caa"
