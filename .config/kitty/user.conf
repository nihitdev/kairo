# ╭─────────────────────────────────────────────╮
# │          A R C H  N E M E S I S            │
# │              kitty overrides               │
# ╰─────────────────────────────────────────────╯

# ── Font ──────────────────────────────────────
font_family      SpaceMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Better programming ligatures
disable_ligatures never

# Emoji fallback
symbol_map U+1F000-U+1FAFF Noto Color Emoji

# ── Cursor ────────────────────────────────────
cursor_shape                 beam
cursor_beam_thickness        1.5
cursor_blink_interval        0.6
cursor_stop_blinking_after   15.0
cursor_trail                 2

# ── Window ────────────────────────────────────
window_padding_width         10
window_margin_width          4
remember_window_size         yes
confirm_os_window_close      0

# Slightly transparent terminal
background_opacity 0.68
dynamic_background_opacity   yes

# ── Tabs ──────────────────────────────────────
tab_bar_edge                 top
tab_bar_style                powerline
tab_powerline_style          slanted
tab_title_template           "  {title}  "
active_tab_font_style        bold
inactive_tab_font_style      normal

# ── Bell ──────────────────────────────────────
enable_audio_bell            no
visual_bell_duration         0.0
window_alert_on_bell         no
bell_on_tab                  no

# ── Mouse ─────────────────────────────────────
mouse_hide_wait              2.0
url_style                    curly
open_url_with                default

# Ctrl+Shift click URL
mouse_map ctrl+shift+left press ungrabbed,grabbed open_url

# ── Scrollback ────────────────────────────────
scrollback_lines             10000
wheel_scroll_multiplier      3.0

# ── Selection / Clipboard ─────────────────────
copy_on_select               clipboard
strip_trailing_spaces        smart

# ── Shell integration ─────────────────────────
shell_integration            enabled

# ── ArchNemesis keybinds ──────────────────────

# New window
map ctrl+shift+enter new_os_window

# New kitty tab
map ctrl+shift+t new_tab

# Close tab
map ctrl+shift+w close_tab

# Navigate tabs
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab

# Move tabs
map ctrl+shift+right move_tab_forward
map ctrl+shift+left  move_tab_backward

# Kitty splits
map ctrl+shift+backslash launch --location=vsplit
map ctrl+shift+minus     launch --location=hsplit

# Navigate splits
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

# Font size
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

