name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes lua5.4 yamllint python3-yaml python3-pil

      - name: Check strict JSON files
        run: |
          jq empty \
            .config/nvim/lazy-lock.json \
            .config/nvim/lazyvim.json \
            .config/oh-my-posh/amro.omp.json

      - name: Check Lua syntax
        run: |
          find .config/hypr .config/nvim .config/yazi .config/wezterm \
            -type f -name '*.lua' -print0 \
            | xargs -0 -n1 luac -p

      - name: Check Git configuration
        run: git config --file .config/git/.gitconfig --list >/dev/null

      - name: Check repository formats and links
        run: |
          python3 .config/scripts/validate_repo.py
          yamllint -d relaxed \
            .github/workflows/validate.yml .github/workflows/build-iso.yml .config/lazygit/config.yml

      - name: Check Linux installer
        run: |
          bash -n install.sh
          bash -n .config/scripts/install-ui.sh
          ./install.sh --help
          ./install.sh --dry-run
          ./install.sh --dry-run --only starship
          ./install.sh --dry-run --only yazi --only broot --only starship
          ./install.sh --dry-run --only nvim --only ssh

          fake_bin=$(mktemp -d)
          printf '#!/usr/bin/env bash\nexit 0\n' >"$fake_bin/pacman"
          chmod +x "$fake_bin/pacman"

          PATH="$fake_bin:$PATH" ./.config/tests/test-install.sh
          python3 .config/tests/test-install-ui.py
          python3 .config/tests/test-iso.py
          python3 .config/tests/test-stage-payload.py
          python3 .config/tests/test-iso-release.py
          bash -n .github/scripts/publish-iso-release.sh
          bash -n iso/build.sh
          bash -n iso/build-rootfs.sh

      - name: Check SDDM theme installer
        run: |
          bash -n .local/share/sddm/themes/archnemesis/install.sh
          bash -n .local/share/sddm/themes/archnemesis/rollback.sh
          bash -n .local/share/sddm/themes/archnemesis/preview.sh
          bash .config/tests/test-sddm-install.sh

      - name: Check Nushell portability guards
        run: |
          grep -Fq 'source $STARSHIP_CACHE' .config/nushell/config.nu
          grep -Fq 'source $ZOXIDE_CACHE' .config/nushell/config.nu
          grep -Fq 'has-command sudo' .config/nushell/config.nu

      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.17.1
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
