name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes lua5.4 yamllint

      - name: Check strict JSON files
        run: |
          jq empty \
            .config/nvim/lazy-lock.json \
            .config/nvim/lazyvim.json \
            .config/oh-my-posh/amro.omp.json

      - name: Check Lua syntax
        run: |
          find .config/nvim .config/yazi .config/wezterm \
            -type f -name '*.lua' -print0 \
            | xargs -0 -n1 luac -p

      - name: Check Git configuration
        run: git config --file .config/git/.gitconfig --list >/dev/null

      - name: Check repository formats and links
        run: |
          python3 .config/scripts/validate_repo.py
          yamllint -d relaxed \
            .github/workflows/validate.yml .config/lazygit/config.yml

      - name: Check Linux installer
        run: |
          bash -n install.sh
          bash -n .config/scripts/install-ui.sh
          ./install.sh --help
          ./install.sh --dry-run
          ./install.sh --dry-run --only starship
          ./install.sh --dry-run --only yazi --only broot --only starship
          ./install.sh --dry-run --only nvim --only ssh

          fake_bin=$(mktemp -d)
          printf '#!/usr/bin/env bash\nexit 0\n' >"$fake_bin/pacman"
          chmod +x "$fake_bin/pacman"

          PATH="$fake_bin:$PATH" ./.config/tests/test-install.sh

      - name: Check Nushell portability guards
        run: |
          grep -Fq 'source $STARSHIP_CACHE' .config/nushell/config.nu
          grep -Fq 'source $ZOXIDE_CACHE' .config/nushell/config.nu
          grep -Fq 'has-command sudo' .config/nushell/config.nu

      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD
