name: Build Kairo ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'iso-v*'

permissions:
  contents: read

# Give each main push a separate run; pending runs must not coalesce.
# The publisher waits for earlier main runs before editing the rolling release.
concurrency:
  group: kairo-iso-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Kairo ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate ISO builder and release publisher
        shell: bash
        run: |
          set -euo pipefail
          test -f iso/build.sh
          bash -n iso/build.sh
          bash -n .github/scripts/publish-iso-release.sh
          df -h .

      - name: Build ISO using Arch Linux
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env CI=true \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed \
                git curl libisoburn squashfs-tools fakeroot gnupg mtools python

              git config --global \
                --add safe.directory /workspace

              bash iso/build.sh
            '

      - name: Verify ISO and checksum
        id: iso
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' images < <(
            find out -maxdepth 1 -type f \
              -name '*.iso' -print0
          )

          if (( ${#images[@]} != 1 )); then
            echo "Expected exactly one ISO in out/" >&2
            exit 1
          fi

          image="${images[0]}"
          checksum="${image}.sha256"
          test -s "$image"
          test -s "$checksum"
          sudo chown "$(id -u):$(id -g)" "$image" "$checksum"
          (cd out && sha256sum -c "$(basename "$checksum")")

          {
            printf 'image=%s\n' "$image"
            printf 'checksum=%s\n' "$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          # Kairo Arch Linux ISO

          Raw, USB-flashable Arch Linux installation medium with Kairo.

          - Download the `.iso` and matching `.sha256` asset.
          - Verify it with `sha256sum -c <downloaded-iso-name>.sha256`.
          - Follow the installation guide in the repository's `iso/README.md`.

          The ISO is uploaded directly as a GitHub Release asset. Assets at or above 2 GiB are rejected; the image is never split or archived.
          EOF

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          ISO_PATH: ${{ steps.iso.outputs.image }}
          CHECKSUM_PATH: ${{ steps.iso.outputs.checksum }}
          RELEASE_NOTES_PATH: release-notes.md
          RELEASE_MODE: rolling
        run: bash .github/scripts/publish-iso-release.sh

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/iso-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          ISO_PATH: ${{ steps.iso.outputs.image }}
          CHECKSUM_PATH: ${{ steps.iso.outputs.checksum }}
          RELEASE_NOTES_PATH: release-notes.md
          RELEASE_MODE: versioned
        run: bash .github/scripts/publish-iso-release.sh
