name: Build Kairo ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'iso-v*'

permissions:
  contents: read

concurrency:
  group: kairo-iso-${{ startsWith(github.ref, 'refs/tags/iso-v') && github.ref || 'rolling' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Kairo ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate ISO builder
        shell: bash
        run: |
          set -euo pipefail
          test -f iso/build.sh
          bash -n iso/build.sh
          df -h .

      - name: Build ISO using Arch Linux
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env CI=true \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed \
                archiso git curl wget rsync sudo libisoburn squashfs-tools fakeroot gnupg mtools python

              git config --global \
                --add safe.directory /workspace

              bash iso/build.sh
            '

      - name: Prepare ISO and checksums
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          mapfile -d '' images < <(
            find out -maxdepth 1 -type f \
              -name '*.iso' -print0
          )

          if (( ${#images[@]} != 1 )); then
            echo "Expected exactly one ISO in out/" >&2
            exit 1
          fi

          image="${images[0]}"
          name="$(basename "$image")"

          sudo chown "$(id -u):$(id -g)" "$image"

          test -s "$image"

          cp -- "$image" "release-assets/$name"

          cd release-assets

          sha256sum "$name" > "$name.sha256"
          sha256sum -c "$name.sha256"

          # GitHub Release assets must be smaller than 2 GiB.
          if (( $(stat -c %s "$name") >= 2 * 1024 * 1024 * 1024 )); then
            echo "ISO is 2 GiB or larger; cannot upload as one raw GitHub Release asset." >&2
            exit 1
          fi

          ls -lh .

      - name: Publish rolling ISO release
        if: ${{ !startsWith(github.ref, 'refs/tags/iso-v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view rolling >/dev/null 2>&1; then
            gh release create rolling --target "$GITHUB_SHA" \\
              --title "Kairo Rolling ISO" --prerelease \\
              --notes "Latest successful Kairo ISO build from main."
          fi
          gh release upload rolling release-assets/* --clobber

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/iso-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<'EOF'
          # Kairo Arch Linux ISO

          Bootable Arch Linux installation medium with Kairo.

          1. Download the ISO and checksum.
          2. Verify the SHA-256 checksum.
          3. Flash the ISO to a USB drive.
          4. Boot and run archinstall.
          5. Reboot and run kairo-setup.

          If the ISO is split into parts, download every
          part and follow REASSEMBLE.txt.

          See iso/README.md for installation instructions.
          EOF

          gh release create "$TAG" \
            release-assets/* \
            --verify-tag \
            --title "Kairo ISO $TAG" \
            --notes-file release-notes.md
